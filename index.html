  "марганцевые руды": { color: "#be185d", svg: `<svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="13" fill="#be185d" stroke="#fff" stroke-width="2"/><rect x="8" y="8" width="12" height="12" rx="2" fill="#f9a8d4" stroke="#fff" stroke-width="1.3"/><text x="14" y="16.5" font-size="7.5" font-weight="bold" fill="#831843" text-anchor="middle">Mn</text></svg>` },
  "ртуть": { color: "#475569", svg: `<svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="13" fill="#475569" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="6" fill="#cbd5e1" stroke="#fff" stroke-width="1.3"/><text x="14" y="16.5" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Hg</text></svg>` }
};

const map = L.map('map', { center: [61.5, 81.5], zoom: 4 });
const gis2 = L.tileLayer('https://tile2.maps.2gis.com/tiles?x={x}&y={y}&z={z}', { attribution: '&copy; 2ГИС', maxZoom: 18 }).addTo(map);
const cartoLight = L.tileLayer('https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { attribution: '&copy; CartoDB &copy; OSM', maxZoom: 19 });
const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', maxZoom: 18 });
L.control.layers({ "2ГИС (Карта)": gis2, "CartoDB Светлая": cartoLight, "Esri Спутник": esriSat }, null, { position: 'topright' }).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
const allMarkers = [];

depositsData.forEach(item => {
  const style = categoryStyles[item.c] || { color: "#2563eb", svg: `<svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/></svg>` };
  const icon = L.divIcon({
    html: `<div class="custom-marker" title="${item.n} (${item.r})">${style.svg}</div>`,
    className: '', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
  });
  const popupHtml = `
    <div class="popup-card">
      <div class="popup-header" style="background:${style.color}">${item.n}</div>
      <div class="popup-body">
        <div class="popup-row"><strong>Ресурс:</strong> ${item.r}</div>
        <div class="popup-row"><strong>Расположение:</strong> ${item.l}</div>
        <div class="popup-row"><strong>Координаты:</strong> ${item.lat}° с.ш., ${item.lng}° в.д.</div>
        <div class="popup-row"><strong>Открыто:</strong> ${item.d} | <strong>Разработка:</strong> ${item.s}</div>
        <div class="popup-row"><strong>Статус:</strong> ${item.a}</div>
        <div class="popup-row"><strong>Запасы:</strong> ${item.v}</div>
        <div class="popup-desc">${item.t}</div>
        ${item.u ? `<a class="popup-link" href="${item.u}" target="_blank" rel="noopener">Открыть источник ↗</a>` : ''}
      </div>
    </div>`;
  allMarkers.push({ data: item, marker: L.marker([item.lat, item.lng], { icon }).bindPopup(popupHtml) });
});

const categories = Object.keys(categoryStyles);
const activeCategories = new Set(categories);
const filtersListEl = document.getElementById('filtersList');

categories.forEach(cat => {
  const count = depositsData.filter(d => d.c === cat).length;
  if (!count) return;
  const label = document.createElement('label');
  label.className = 'filter-item';
  label.innerHTML = `<input type="checkbox" value="${cat}" checked><div class="filter-icon">${categoryStyles[cat].svg}</div><span class="filter-label">${cat}</span><span class="filter-count">${count}</span>`;
  const cb = label.querySelector('input');
  cb.addEventListener('change', () => { cb.checked ? activeCategories.add(cat) : activeCategories.delete(cat); updateMap(); });
  filtersListEl.appendChild(label);
});

const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
const statsText = document.getElementById('statsText');

function updateMap() {
  const q = searchInput.value.trim().toLowerCase();
  clearSearchBtn.style.display = q ? 'block' : 'none';
  markersLayer.clearLayers();
  let visible = 0;
  allMarkers.forEach(({ data, marker }) => {
    const matchCat = activeCategories.has(data.c);
    const matchQ = !q || data.n.toLowerCase().includes(q) || data.l.toLowerCase().includes(q) || data.r.toLowerCase().includes(q) || data.t.toLowerCase().includes(q);
    if (matchCat && matchQ) { markersLayer.addLayer(marker); visible++; }
  });
  statsText.textContent = `Показано: ${visible} из ${depositsData.length}`;
}

searchInput.addEventListener('input', updateMap);
clearSearchBtn.addEventListener('click', () => { searchInput.value = ''; updateMap(); });
document.getElementById('selectAllBtn').addEventListener('click', () => { document.querySelectorAll('#filtersList input').forEach(cb => { cb.checked = true; activeCategories.add(cb.value); }); updateMap(); });
document.getElementById('deselectAllBtn').addEventListener('click', () => { document.querySelectorAll('#filtersList input').forEach(cb => { cb.checked = false; activeCategories.delete(cb.value); }); updateMap(); });
updateMap();
</script>
<script src="addon.js"></script>
</body>
</html>
